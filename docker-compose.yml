# ------------------------------------------------------------------
# Restaurant AI — local development stack.
#
# The database / auth / storage comes from Supabase. Use either:
#   A) Local CLI  : `supabase start`   -> http://localhost:54321
#   B) Hosted     : your supabase.com project
#
# Prerequisites, in order:
#   1. cp .env.example .env.local
#   2. Fill in NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and
#      MISTRAL_API_KEY (see README for where to get them).
#   3. docker compose up --build
#
# `.env.local` is OPTIONAL for Compose: the stack boots without it and
# http://localhost:3000/api/health reports the app as alive but with
# "backend": false until the Supabase values are filled in.
#
# Services:
#   web   -> the Next.js app at  http://localhost:3000
#
# Containers talk to each other via the compose service name, e.g. "web:3000".
# The browser reaches the containers via the ports below. Do not use
# "localhost" from inside a container.
# ------------------------------------------------------------------

name: restaurant-ai

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: restaurant-ai-web:local
    container_name: restaurant-ai-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Long form with `required: false`: Compose only aborts a project when an
    # env_file is REQUIRED and missing, so a newcomer can bring the stack up
    # before creating .env.local.
    env_file: [{ path: .env.local, required: false }]
    environment:
      # Inside Docker, "localhost" is the container itself.
      # Override defaults that must point at the host machine if needed.
      NODE_ENV: production
    healthcheck:
      # Liveness only: /api/health takes no env vars and never touches the DB.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# NOTE: this app has NO n8n / webhook integration — zero lines of src/ reference
# it, and the old `./n8n` bind mount did not exist, so Compose silently created
# an empty junk directory next to the repo. The n8n service, its volume and its
# depends_on entry were therefore removed.
# If a workflow engine is ever needed, add it as a SEPARATE compose file (e.g.
# docker-compose.workflows.yml) instead of growing this one.
